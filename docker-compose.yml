name: cn230_lci-project

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cn230lci
      POSTGRES_USER: cn230lci
      POSTGRES_PASSWORD: portugalsql
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # ไฟล์ .sql/.sh ในโฟลเดอร์นี้จะรันอัตโนมัติ "ครั้งแรกที่สร้าง volume เท่านั้น" (เรียงตามชื่อไฟล์)
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cn230lci -d cn230lci"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-cn230lci2026}
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-cn230lci2026}' 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
  neo4jdata:
