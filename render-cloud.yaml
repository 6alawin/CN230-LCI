# Apply to a CPU service with enough RAM after checking the selected compute plan.
# Does not upgrade or bill the existing service automatically.
services:
  - type: web
    name: cn230-lci-cloud-embedding
    runtime: python
    buildCommand: pip install -r requirements-cloud.txt && python scripts/download_cloud_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SEARCH_BACKEND
        value: local_model
      - key: CLOUD_SNAPSHOT_SCHEMA
        value: lci_verified_20261115
      - key: LOCAL_MODEL_PATH
        value: models/lci-embedding
      - key: OMP_NUM_THREADS
        value: '1'
      - key: TOKENIZERS_PARALLELISM
        value: 'false'
